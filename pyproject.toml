[tool.ruff]
# Deliberately one below the real runtime floor. hacs.json requires HA 2026.9.1,
# which needs Python 3.14.2+, but setting py314 here makes the formatter rewrite
# `except (A, B):` to PEP 758 `except A, B:` - syntax that no Python before 3.14
# can even parse, turning any version slip into a SyntaxError instead of a clean
# HACS version block. The rewrite buys nothing, so the target stays at py313.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
